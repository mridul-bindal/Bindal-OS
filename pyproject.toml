[project]
name = "bindal-os"
version = "0.1.0"
description = "A simple document search engine with inverted indexing"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.1",
    "sentence-transformers>=3.0.0",
    "stopwords>=1.0.2",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "test",
]

[project]
name = "bindal-os"
version = "0.1.0"
description = "A simple document search engine with inverted indexing"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "sentence-transformers>=3.0.0",
    "stopwords>=1.0.2",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "test",
]
